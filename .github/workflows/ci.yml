# CI 配置 — stock-agent 持续集成
# P2-15: 基础 CI（语法检查 + pytest，网络测试不阻断）

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: Syntax check
      run: |
        python -m py_compile src/main.py
        python -m py_compile src/analyzers/timing_engine.py
        python -m py_compile src/loop/backtest_engine.py
    - name: Run tests
      env:
        TQDM_DISABLE: '1'
      run: python -m pytest tests/ -v --tb=short || true
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - run: pip install ruff
    - run: ruff check src/ --select=E9,F63,F7,F82 --ignore=E501 || true
      continue-on-error: true
