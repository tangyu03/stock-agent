# pool.yaml — 股票池的人工编辑入口（声明式全量定义）
# ============================================================
# 语义：
#   本文件描述"完整的期望池子"，不是增删量。pool-sync 用它整体重写
#   sync_date 当天的池子快照（当日行先 DELETE 后 INSERT，单事务完成；
#   历史日期的行永不改动）。
#
# 工作流：
#   编辑本文件 → python -m pointtable.cli pool-sync
#   → 检查输出 JSON：added / removed / changed / kept 应与编辑意图一致
#   （removed 非空表示有票移出池子）。同日重复执行幂等（全部 kept）。
#   运行时（evening / watch / restore-check / market-input）读取
#   date <= 查询日 的最新快照，新快照落库即生效。
#
# 字段：
#   symbol 必填；纯数字自动补齐 6 位（未加引号的 002975 会被 YAML
#     解析成整数 2975，无需手动加引号）。
#   theme 可选。解析顺序：此处显式写的非空 theme（原样使用，包括字面
#     'unknown'）→ theme_map.yaml overrides → 'unknown'。
#     想让某票改走 theme_map 兜底：删掉 theme 行或留空即可。
#   role 可选，默认 holding；可选值 holding / index / sector / candidate。
#   name 仅为人类阅读备注，系统不读取。
#
# 注意：pool 是关注范围，不是持仓清单。
# ============================================================

pool:
