# theme_map.yaml — 主题归属修正层（Phase2-B）
# ============================================================
# 背景（用户实测批评）：
#   行业数据库自动映射把澜起/海光/大普微/中科飞测/芯碁微装/胜蓝/兆易创新
#   统统归入"电子化学品"，骄成超声归"电池"，创世纪归"自动化设备"——
#   与市场实际交易的主题归属（半导体设备/存储/算力硬件）差异很大。
#   而"主线/退潮/轮动"的板块状态判定直接决定"禁追强/低吸可用"闸门输出。
#
# 优先级（theme_attribution.resolve_stock_theme）：
#   ① overrides   —— 下表人工映射（code → 主题），最高优先级
#   ② fallback    —— 原行业链路结果（sector_ranker），保持不动
#
# 状态判定：主题的 proxy_boards（THS 行业/板块名）取最严格状态
#   （retreating > main_trend > rotational > unknown），代理板块状态不可得时
#   沿用原行业状态。显示名带"(主题)"后缀，与行业名区分。
# ============================================================

enabled: true

# 主题定义：display 显示名；proxy_boards 状态代理板块（THS 90 行业名，可多选）
themes:
  半导体设备:
    display: 半导体设备
    proxy_boards: [半导体, 专用设备]
  半导体:
    display: 半导体
    proxy_boards: [半导体]
  存储:
    display: 存储
    proxy_boards: [半导体]
  算力硬件:
    display: 算力硬件
    proxy_boards: [半导体, 计算机设备, 通信设备]
  先进封装:
    display: 先进封装
    proxy_boards: [半导体]
  光模块CPO:
    display: 光模块(CPO)
    proxy_boards: [通信设备]
  3C设备:
    display: 3C设备(苹果链)
    proxy_boards: [消费电子, 专用设备]
  消费电子:
    display: 消费电子
    proxy_boards: [消费电子]
  量子科技:
    display: 量子科技
    proxy_boards: [计算机设备]

# 个股人工映射（code → themes 键名）。市场主题归属以实盘交易主线为准，
# 与行业数据库分类不同时，此处覆盖。未列出的股票走原行业链路兜底。
overrides:
  # 存储（DRAM/接口芯片/NOR/SSD 主控）
  "688008": 存储        # 澜起科技（内存接口芯片，被误归电子化学品）
  "301666": 存储        # 大普微（企业级 SSD 主控）
  "603986": 存储        # 兆易创新（NOR/NAND）
  "688627": 存储        # 精智达（存储测试设备，测试属性但跟存储主线）
  # 半导体设备（检测/光刻/划片/分选/键合/零部件）
  "688361": 半导体设备  # 中科飞测（检测量测，被误归电子化学品）
  "688630": 半导体设备  # 芯碁微装（直写光刻，被误归电子化学品）
  "688409": 半导体设备  # 富创精密（设备零部件）
  "688392": 半导体设备  # 骄成超声（键合设备，被误归电池——锂电只是旧业务）
  "300480": 半导体设备  # 光力科技（划片机）
  "301392": 半导体设备  # 汇成真空（真空镀膜设备）
  "688328": 半导体设备  # 深科达（半导体+显示检测）
  "603061": 半导体设备  # 金海通（测试分选机）
  # 半导体设计/IP
  "688521": 半导体      # 芯原股份（IP 授权）
  "688048": 半导体      # 长光华芯（激光芯片）
  # 先进封装
  "688820": 先进封装    # 盛合晶微（晶圆级封装）
  # 算力硬件（CPU/DCU/服务器）
  "688041": 算力硬件    # 海光信息（CPU/DCU，被误归电子化学品）
  # 光模块/CPO
  "300308": 光模块CPO   # 中际旭创
  "300757": 光模块CPO   # 罗博特科（CPO 耦合设备，光伏只是旧业务）
  # 3C设备/苹果链
  "300083": 3C设备      # 创世纪（CNC 钻攻机，被误归自动化设备）
  "002975": 3C设备      # 博杰股份（自动化测试设备）
  # 消费电子
  "300843": 消费电子    # 胜蓝股份（精密连接器，被误归电子化学品）
  # 量子科技
  "688027": 量子科技    # 国盾量子
