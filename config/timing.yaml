version: "1.0"

# ============================================================
# 择时引擎阈值配置
# ============================================================
# 本文件是 timing_engine.py 所有判断阈值的唯一参数源。
# 回测 (loop/) 与实盘推送 (orchestrator/intraday) 共用同一份配置，
# 保证回测优化出的最优参数可直接迁移到实盘。
#
# 修改阈值时请同步更新 src/analyzers/timing_engine.py 中
# 对应的 self._tc[...] 读取代码。
# ============================================================

timing:

  # ──────────────── 恐慌抄底 (_check_panic_bottom) ────────────────
  panic_bottom:
    index_drop_threshold: 4.0            # 上证跌幅 > 4% 判定大盘恐慌
    gem_star_drop_threshold: 5.0         # 双创跌幅 > 5% 判定大盘恐慌
    ad_ratio_extreme_weak: 0.15          # 涨跌比 < 0.15 判定市场极弱
    panic_volume_ratio: 2.0              # 量比 > 2.0 判定恐慌放量
    panic_volume_index_drop: 2.0         # 恐慌放量需配合上证跌幅 > 2%
    significant_volume_ratio: 1.5        # 量比 > 1.5 判定显著放量
    stock_drop_threshold: -7             # 个股单日跌幅 < -7% 判定超卖（从-5%提高）
    drop_5d_threshold: -0.15            # 5日跌幅 > 15% 判定超卖
    high_confidence_market_conds: 1      # 高置信度需要的大盘恐慌条件数
    high_confidence_stock_conds: 2       # 高置信度需要的个股超卖条件数

  # ──────────────── 套利低吸 (_check_arbitrage_entry) ────────────────
  arbitrage:
    shrinking_volume_ratio: 1.0          # 量比 < 1.0 视为缩量
    min_trigger_conditions: 1            # 至少满足几条积极信号才触发

  # ──────────────── 确认追强 (_check_momentum_chase) ────────────────
  momentum_chase:
    ma20_trend_min_klines: 21            # MA20 趋势判定最少 K 线数
    ma20_window: 20                      # MA20 计算窗口
    breakout_price_ratio: 0.99           # 价格 >= 近20日最高 × 0.99 视为突破
    volume_confirm_ratio: 1.2            # 量比 < 1.2 视为未放量确认

  # ──────────────── 价量突破 (_check_volume_breakout) ────────────────
  volume_breakout:
    require_rs_above_ma: true            # attack 模式下 RS 必须站上均线
    # 【三】事件边界（状态→事件）：“站上MA25”是状态，今明两天都为真，
    # 导致同一信号连发两天。事件化后只在突破当日诞生：
    # 昨收 <= 昨日MA25 且 今价站上今日MA25
    require_event_boundary: true
    # 【三】诞生双腿之一：当日收阳（日内以 现价>今开 近似）
    require_bullish_close: true

  # ──────────────── 【一】可证伪假说出厂检查 (hypothesis.py) ────────────────
  # 每笔交易必须能写成：因为X，所以在Y买入；若Z出现认错离场；若W出现兑现离场。
  # X/Y/Z/W 缺一即拒绝（不进调度不推送，写入 signal_rejections 表留痕）。
  hypothesis_gate:
    enabled: true                        # 总开关（关闭后回退旧行为，仅供对照）
    # 【评分层→决策层】期望值闸门（EV gate）— 评分必须连闸门。
    # 实证（9/8 盘前）：蘅东光/罗博特科两条买入信号置信度 0/6 照样放行——
    # EV = W×R−(1−W)，RRR0.96 隐含盈亏平衡胜率 51%，而系统自己给的
    # 信号质量是全池最低档，拿不出超过盈亏平衡线的胜率证据。
    # 结论：负期望不出场，空仓是合法输出（决策记录 12 项里少数没动的）。
    ev_gate:
      enabled: true
      min_confidence_score: 2            # 评分 ≤1 不入买入区（0/6、1/6拦截）
      min_trades_for_win_rate: 30        # 策略统计不足该笔数时不给 W 证据
      default_win_rate: 0.5              # 无统计时 W 的保守值（不优于盈亏平衡）
    # 【P0-2 + Phase5 回炉】Z 线统一：决策记录本写“结构位**或**结构位加
    # 1~2 倍 ATR 缓冲”，Phase4 只做了前半句（裸结构位）——9/8 验收实证：
    # 精智达裸结构位 476.75 距买点 480.77 仅 0.84%，日振幅 8.16% 的
    # 十分之一即可扫损，RRR 被分母过小抬到 12.3 神话数字。
    # buffered_structure（默认）: 结构位−clamp(k×ATR)（k 自适应 1.5~2，
    #   下限防毫厘止损，上限 8% 防拖到跌停价——博杰 9/7 旧病：
    #   1.5×ATR=13.85 恰好拖到 85.54=当日跌停价）。
    # bare_structure: Z=结构位本体（对照族；防噪下限仍在：<0.8% 拒绝出厂）。
    # atr_buffer: 结构位−max(1.5×ATR,0.5%)（Phase1 旧行为，回退族）。
    # 作废条件：z_mode_comparison 30 笔分层统计，哪族期望低否决哪族。
    z_line_mode: buffered_structure
    z_atr_mult: 1.5                     # 高波动档（ATR/结构位≥5%）缓冲倍数
    z_atr_mult_low_vol: 2.0             # 低波动档（ATR 绝对值小，倍数补足）
    z_high_vol_ratio: 0.05              # 高/低波动分档线（ATR/结构位）
    z_pct_buffer: 0.005                 # 缓冲下限（结构位%，防毫厘止损）
    z_buffer_max_pct: 0.08              # 缓冲上限（结构位%，防拖到制度边界）
    bare_noise_min_pct: 0.008           # 裸结构位防噪下限（止损距离<0.8%拒绝）
    min_z_buffer_pct: 0.01              # ATR 缺失时 Y-Z 最小百分比宽度

  # ──────────────── 【Phase4 P0-1】量能外推口径 (volume_projection.py) ────────────────
  # 盘中累计量÷U型分位→全天量。蘅东光 9/7 实证：1.02x 拦截→外推 2.0x 触发。
  # 10:00 前禁用（开盘冲量高估）/ 封板禁用 / 14:45 后退化累计量 / 回测禁用。
  # 每日收盘比对“外推 vs 实际”误差进记录表（作废条件的数据基础设施）。
  # 作废条件：10:30 后误差持续>15% → 换标的池自身分位数表（框架保留，参数重校）。
  volume_projection:
    enabled: true
    start_time: "10:00"
    end_time: "14:45"
    breakout_threshold: 1.2              # 外推口径量能突破阈值（比实际口径 1.0 更严）
    error_alert_pct: 15.0                # 作废条件阈值
    error_check_days: 10                 # 误差统计窗口（两个交易周）

  # ──────────────── 【Phase4 P1-1】防守模式确认追强降仓可用 ────────────────
  # 防守的定义是压缩敞口而非禁用策略（蘅东光 9/7 +14.81%/量比2.01/ADX48 零提示）。
  # 三重门全过才放行：四确认+基本面+板块联动；任何一关不过不放行。
  # 试探仓 = 单笔风险预算÷止损距离（1%÷3.5%≈29%≈1/3；高波动~10%）。
  # 作废条件：30笔滚动胜率<30%且期望<0 → 回退禁用，踏空成本继续留档。
  defensive_chase:
    enabled: true
    risk_budget_pct: 0.01                # 单笔风险预算（账户%）
    max_probe_ratio: 0.3333              # 试探仓封顶（中波动近似 1/3）
    min_stop_distance_pct: 0.01          # 防毫厘止损杠杆化
    rsi_overheat: 67.0                   # 门一时机：RSI14≥此值过热（蘅东光 9/3 RSI66.6 实证）
    new_high_ratio: 0.99                 # 门一①：现价≥近20日高×此值
    volume_ratio_min: 1.2                # 门一②：量比下限
    projected_volume_min: 1.2            # 门一③：外推量能下限（与实际口径取其一）
    adx_min: 25.0                        # 门一④：单边力度（蘅东光 9/7 实证 48）
    profit_yoy_min: 30.0                 # 门二：净利同比下限（%）
    shareholder_dispersion_max: 0.20      # 门二：户数增加>20%=筹码分散/减持迹象→拦

  # ──────────────── 【层间接口】仓位层→账户层：预算绝对值显式化 ────────────────
  # 蘅东光 9/8 验收：300股 × 单股风险88.56 = 26,568 元单笔风险敞口，若按
  # 1% 风险预算反推隐含 265 万账户——仓位公式对了，预算绝对值却从不披露。
  # 本块显式给出建议股数的预算基数与账户口径，推送/参数附录一并披露。
  # 作废条件：账户口径与实际资金不符时由用户在配置更新，披露机制永不作废。
  position_budget:
    budget_per_stock: 250000             # 单股参考仓位（建议股数基数，非拦截信号）
    account_value: 1000000               # 账户总值（披露口径：风险预算%×账户=单笔风险额）

  # ──────────────── 【Phase4 P1-2】再入场循环 (signal_lifecycle.py) ────────────────
  # 止损是尝试的结束，不是死刑判决（蘅东光 9/4 止损-5%、9/7 +14.8%，
  # 缺的只是第二次入场）。再入场只由新事件驱动（创新高/收复Z线+完整
  # 触发条件重确认），绝不基于沉没成本。作废条件：二次突破失败率>70%
  # → 收缩为仅创新高可再入。
  reentry:
    enabled: true
    max_reentries: 2                     # 同标的再入场次数上限
    new_high_ratio: 0.99                 # 创新高再入场：现价≥近20日高×此值

  # ──────────────── 【Phase4 P3-1】趋势延续策略 (timing_engine) ────────────────
  # 突破后 1~10 日延续段回踩入场（沃尔德 9/7 +7.02% 处于突破后延续段，
  # 四策略无一覆盖）。作废条件：延续段入场期望值低于突破日入场
  # → 降级为只加仓已有持仓。
  trend_continuation:
    enabled: true
    min_bars_since_breakout: 1
    max_bars_since_breakout: 10
    volume_ratio_min: 1.2                # 回踩不破+再度放量
    ma_alignment: true                   # 要求 MA 多头排列

  # ──────────────── 【Phase4 P3-2】第八问驱动源 (driver_attribution.py) ────────────────
  # 博杰 9/7 真实驱动=业绩+PCB联动，系统只看到价格表象。
  # 作废条件：驱动源分类与 5 日收益无显著相关 → 删除该问避免噪声。
  driver_attribution:
    earnings_yoy_min: 50.0               # 业绩驱动：净利同比下限（%）
    funds_volume_ratio_min: 1.5          # 资金驱动：量比下限（需外盘占优）

  # ──────────────── 【Phase4 P2-3】组合预算 (portfolio_budget.py) ────────────────
  # 个股纪律齐备但集群裸奔：同板块并发敞口上限（9/7 半导体设备 8 只同标签）。
  # 作废条件：若回测显示集中主线期望值更高，放宽上限而非删除。
  portfolio_budget:
    enabled: true
    max_per_sector: 3                    # 同板块最大并发敞口（持仓+新信号）
    include_holdings: true               # 预算计入已有持仓

  # ──────────────── 【Phase4 P0-2 + Phase5 回炉】置信度质量票 (signal_plan.py) ────────────────
  confidence:
    rrr_quality_threshold: 2.5           # RRR≥此值 +1 票（隐含胜率 28.6%，出处非惯例）
    rrr_quality_cap: 5.0                 # 【Phase5】RRR>此值不加分（分母过小=止损距离神话嫌疑）

  # ──────────────── 策略专属买点分档 (timing_engine/signal_plan) ────────────────
  tiering:
    chase_pullback_pct: 0.02             # 确认追强主买点 = 触发位下方 2%
    chase_probe_pct: 0.02                # 追强分档试探价偏移（主档下方浅回踩）

  # ──────────────── 【Phase5 回炉】风险乘数波动率分档 (signal_plan.py) ────────────────
  # 验收实证（9/8）：精智达日振幅 8.16%、风险系数 1.00；博杰反而 0.60
  # ——风险系数随机出现等于没有风险系数。规则化：振幅分档。
  # 反方：低波动不降档（换手已有 turnover_hot 单独惩罚）。
  # 作废条件：strategy_stats 分层统计 vol_tier 档期望不低于全样本 → 移除。
  risk:
    volatility_tier:
      enabled: true
      high_amp: 0.08                    # 振幅≥8% → 0.6（精智达 9/8 实证）
      mid_amp: 0.05                     # 振幅≥5% → 0.8
      high_mult: 0.6
      mid_mult: 0.8
      window: 5                         # 近 N 日平均振幅窗口

  # ──────────────── 【二】数据层一致性守卫 (signal_plan.py) ────────────────
  # 科创板“股被当手”两条最便宜的拦截（口径统一：全链路成交量=股）：
  #   规则1: 量比<1 而量能倍数>10 → 脏数据拦截（9/3 全部 4 条误触发）
  #   规则2: 换手<阈值% 而成交量>阈值股 → 脏数据拦截（9/4 沃尔德）
  data_guard:
    turnover_threshold_pct: 10.0         # 换手率阈值（%）
    max_volume_shares: 1000000000.0      # 成交量阈值（股）：10 亿

  # ──────────────── 【二】基本面闸门 (fundamental_gate.py，Phase2-A) ────────────────
  # 框架不再只看 K 线和资金流：业绩雷（veto 出厂拒绝）、盈利质量（净利与扣非
  # 背离 ≥30pp → 降级+风险乘数）、财报窗口（披露日前 N 天降级）。
  # 数据缺失时放行（不产生假基本面结论）；业绩数据为报告期级，展示强制带口径。
  fundamental_gate:
    enabled: true
    bomb_forecast_types: [预亏, 首亏, 续亏, 增亏, 预减]   # 预告类型 → 业绩雷
    bomb_yoy_threshold: -30.0            # 扣非/净利同比低于该值（%）→ 业绩雷
    quality_gap_pp: 30.0                 # 净利同比-扣非同比 ≥ 30pp → 盈利质量低
    report_window_days: 7                # 距法定披露日 ≤ N 天 → 财报窗口降级
    warn_risk_multiplier: 0.6            # warn 级风险乘数（与 turnover_hot 同一体系）
    cache_ttl_seconds: 3600              # 基本面快照 session 缓存 TTL
  # 【Phase3】估值透镜：高增长≠便宜（报告只列净利同比导致方向性误判）
  valuation_lens:
    enabled: true
    bubble_pe_threshold: 300.0           # PE(TTM) ≥ 该值 → 泡沫；叠加低基数(净利<2亿)→ veto
    elevated_pe_threshold: 60.0          # PE ≥ 该值 → 估值偏高（科技股常态，仅标注）
    value_pe_threshold: 60.0             # PE < 该值 + 真增长(≥50%且≥5亿) → 低估真增长
    real_growth_yoy: 50.0                # 低估真增长要求的最低净利同比（%）
    real_profit_threshold: 5.0           # 低估真增长要求的净利体量（亿元）
    low_base_yoy: 100.0                  # 同比 ≥ 100% 且净利 < 2亿 → 低基数反转
    low_base_profit_threshold: 2.0       # 低基数判定的净利体量（亿元）
    strategic_contract_liab_pct: 30.0    # 亏损时合同负债较年初 ≥ 该值(%) → 战略性亏损
    strategic_inventory_pct: 20.0        # 亏损时存货较年初 ≥ 该值(%) → 战略性亏损
    model_loss_risk_multiplier: 0.5      # 模式性亏损（低吸型）风险乘数
    bubble_warn_risk_multiplier: 0.5     # 泡沫(warn级)风险乘数
    warn_risk_multiplier: 0.6            # 其余 warn 级风险乘数
    consensus_buy_ratio: 60.0            # 研报买入+增持占比 ≥ 该值(%) → 共识看多
    consensus_min_votes: 3               # 或买入+增持 ≥ N 家 → 共识看多
    conflict_flow_score: -1              # 资金票 ≤ 该值 且研报看多 → 冲突标记
    cache_ttl_seconds: 3600              # 估值/研报/资产负债表 session 缓存 TTL

  # ──────────────── 【三】信号事件生命周期 (signal_lifecycle.py) ────────────────
  # 诞生（突破当日+收阳+量能）→ N 日内回踩买点有效 →
  # 收盘跌回突破位/板块退潮立即撤单 → 超期作废。
  signal_lifecycle:
    valid_days: 5                        # 回踩买点有效期（N 日）

  # ──────────────── 【六】策略分层统计与自动下线 (strategy_stats.py) ────────────────
  # 一套不能被自己的业绩杀死的逻辑，不算被厘清，只是被相信。
  strategy_stats:
    min_trades_for_stats: 30             # 分层统计最小样本
    kill_rolling_window: 50              # 滚动窗口
    kill_min_trades: 50                  # 下线判定的最小样本（不足只报告不下线）

  # ──────────────── 出场信号 (check_exit_signals) ────────────────
  exit:

    # 【P0-3】卖出条件分级 OR：止损类（价格破Z线、技术走弱）任一即出，
    # 不容商量；止盈类（冲高止盈、MA5压制）保持原有计票。
    # 原阈值 strong≥1 或 medium≥3 近乎永不开启（两天 30+ 次检查零触发，
    # 汇成真空 -6% 无响应）→ 分级 OR 下技术走弱 medium≥2 即出。
    # 作废条件：周触发>5次且过半3日内回本 → 回调结构位距离参数，而非回退AND。
    graded_or:
      enabled: true
      weakness_medium_min: 2              # 止损类：技术走弱 medium≥此值即出（原3）

    # 极端超卖共振：只降级非价位类的技术走弱；破位止损永不拦截。
    oversold:
      rsi6_min: 25.0                      # RSI6 ≤ 25
      kdj_j_max: 5.0                      # KDJ-J ≤ 5

    # 破位止损/预警
    breakdown:
      volume_confirm_ratio: 0.8          # 量比 > 0.8 才视为有效破位
      heavy_volume_ratio: 1.3            # 量比 > 1.3 视为放量破位

    # 上涨衰竭（15 个子项）
    exhaustion:
      rsi_severe_overbought: 80          # RSI > 80 → 严重超买 (strong)
      rsi_overbought: 70                 # RSI > 70 → 高位 (medium)
      rsi_divergence_window: 14          # RSI 顶背离需要的 K 线数
      rsi_divergence_threshold: 65       # 价创新高但 RSI < 65 → 顶背离
      volume_price_div_window: 10        # 量价背离需要的 K 线数
      volume_price_div_avg_window: 5     # 量价背离用前 5 日均量
      volume_shrink_ratio: 0.8           # 今日量 < 前N日均 × 0.8 → 量价背离
      upper_shadow_window: 3             # 上影线判断需要的 K 线数
      upper_shadow_strong_ratio: 1.5     # 连续上影 > 实体 × 1.5 (strong)
      upper_shadow_medium_ratio: 1.0     # 连续上影 > 实体 × 1.0 (medium)
      upper_shadow_min_count: 2          # 至少 2 根上影线
      long_upper_shadow_body_ratio: 3    # 长上影 > 实体 × 3 (strong)
      long_upper_shadow_volume_ratio: 1.5 # 长上影需量比 > 1.5
      upper_shadow_body_ratio_medium: 2  # 普通上影 > 实体 × 2 (medium)
      kdj_dead_cross_k: 70              # KDJ K > 70 且 K < D → 死叉
      kdj_blunt_j: 100                  # KDJ J > 100 → 钝化
      macd_kdj_resonance_k: 60           # MACD负 + K<D + K>60 → 顶部共振
      vote_neutral_negative_score: 0    # 中性投票 + score < 0 → 转空
      ma5_bias_overheat: 0.08           # MA5 乖离 > 8% → 过热
      strong_signal_min_count: 2         # strong 信号 ≥ 2 才推送冲高止盈（过滤单一信号噪音）
      macd_as_exhaustion: false         # MACD 死叉不作为独立衰竭信号（已在投票系统"趋势组"算过，避免双重计票）

  # ──────────────── 止损价计算 (calculate_stop_loss) ────────────────
  stop_loss:
    multiplier: 0.97                     # 止损价 = 支撑位 × 0.97（核心系数）
    fallback_support_ratio: 0.95         # C1整改: 0.92→0.95，刚破位时止损价离现价5%而非8%
    max_support_distance: 0.06           # C1整改: 0.12→0.06，支撑位距现价超6%即回退
    use_atr_buffer: false                # 是否启用 ATR buffer（默认关闭）
    atr_min_klines: 15                   # ATR 计算最少 K 线数
    atr_period: 14                       # ATR 周期
    atr_multiplier: 2                    # buffer = N × ATR
    fallback_buffer_ratio: 0.02          # K线不足时退化为 当前价 × 2%
    tracking_stop:
      definition: "技术支撑跟踪线，逐日重算，只作风控提示；事件Z仍是买入事件的结构位硬止损"
      enabled_from: filled
      supports: [MA5, MA10, MA20, BOLL下轨]
      algorithm: "近端支撑×multiplier；无近端支撑用当前价×fallback_support_ratio"
      only_up: false
      change_log: true

  # ──────────────── 推导链投票阈值 (_build_derivation) ────────────────
  derivation:
    vote_bullish_threshold: 1.0          # vote_score > 1.0 → 投票偏多
    vote_bearish_threshold: -1.0         # vote_score < -1.0 → 投票偏空
    rsi_high_contradiction: 65           # RSI > 65 且投票偏空 → 矛盾提示
    rsi_low_contradiction: 35            # RSI < 35 且投票偏多 → 矛盾提示

  # ──────────────── 技术数据计算 (_fetch_tech_data) ────────────────
  tech_data:
    min_klines_for_indicator: 20         # 计算 tech indicators 最少 K 线数
    min_klines_for_tech_vote: 30         # 计算 tech vote + K线形态 最少 K 线数
    ma25_window: 25                      # MA25 窗口
    ma25_prev_window: 26                 # 昨日 MA25 需要的 K 线数
    ma60_window: 60                      # MA60 窗口
    ma120_window: 120                    # MA120 窗口
    volume_ma60_window: 60               # 60 日均量线
    recent_extreme_window: 20            # 近 N 日最高/最低
    volume_ratio_avg_window: 6           # 收盘量比均量窗口（6 条算，剔除当日 = 前5日均量；标准量比收盘时=当日量/前5日均量）
    shrinking_volume_ratio: 1.0          # 设计问题5: 量比 < 1.0 → 缩量回踩候选（原 0.8）
    pullback_ma5_bias_tolerance: 0.03    # 设计问题5: MA5 乖离 ±3% → 视为回踩（原 ±1%）
    pullback_ma10_bias_tolerance: 0.03   # 设计问题5: MA10 乖离 ±3% → 视为回踩（原 ±1%）
    hammer_lower_shadow_ratio: 2         # 锤子线：下影线 > 实体 × 2
    limit_down_ratio: 0.9                # 跌停价 = 昨收 × 0.9
    limit_down_touch_tolerance: 1.002    # 最低价触及跌停 × 1.002
    limit_down_open_threshold: 1.02      # 收盘 > 跌停 × 1.02 → 跌停被撬开
    weekly_macd_min_weeks: 26            # 周线 MACD 需要的周数
    ema12_period: 12                     # EMA12 周期
    ema26_period: 26                     # EMA26 周期
    dea_smooth_iterations: 8             # DEA 平滑次数

  # ──────────────── 止盈区间 (_calculate_target_range) ────────────────
  target_range:
    panic_bottom_low: 1.08               # 恐慌抄底止盈下限 +8%
    panic_bottom_high: 1.18              # 恐慌抄底止盈上限 +18%
    arbitrage_with_resistance_low: 0.97  # 套利(有阻力)下限 阻力×0.97
    arbitrage_with_resistance_high: 1.02 # 套利(有阻力)上限 阻力×1.02
    arbitrage_no_resistance_low: 1.05    # 套利(无阻力)下限 +5%
    arbitrage_no_resistance_high: 1.08   # 套利(无阻力)上限 +8%
    momentum_chase_low: 1.05             # 确认追强下限 +5%
    momentum_chase_high: 1.12            # 确认追强上限 +12%
    volume_breakout_low: 1.08            # 价量突破下限 +8%
    volume_breakout_high: 1.15           # 价量突破上限 +15%
    default_with_resistance_low: 0.97    # 默认(有阻力)下限
    default_with_resistance_high: 1.02   # 默认(有阻力)上限
    default_no_resistance_low: 1.05      # 默认(无阻力)下限
    default_no_resistance_high: 1.08     # 默认(无阻力)上限

  # ──────────────── 数据预取 (prefetch_*) ────────────────
  prefetch:
    index_min_klines: 2                  # 上证指数至少 N 条 K 线
    market_vol_avg_window: 20            # 20 日均成交额窗口
    max_workers: 4                       # 并发预取线程数
    hist_calendar_days: 240              # 个股日K预取窗口；覆盖节假日和停牌

  # ──────────────── 回测专用：仓位管理 ────────────────
  # 这部分不参与 timing_engine 实时判断，仅供 backtest loop 使用
  # 出场逻辑全部由 TimingEngine.check_exit_signals 负责，回测不加额外判断
  backtest:
    budget_per_stock: 250000             # 单股最大仓位
    max_concurrent_positions: 4          # 最大并发持仓数
    cooldown_days_after_sell: 3          # 卖出后冷却天数