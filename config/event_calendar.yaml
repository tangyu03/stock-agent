# F5 事件日历 - 人工维护部分
# ============================
# 用于补充解禁日历（自动）无法覆盖的事件：
# - 财报节点（鸡哥财报前两日谨慎）
# - 停战期满
# - 宏观事件落地前减仓
# - 新股上市锚定卖出
#
# 格式：
#   events:
#     - date: "YYYY-MM-DD"      # 事件日期
#       type: "财报/停战/宏观/新股"  # 事件类型
#       code: ""                 # 股票代码（空=全市场）
#       detail: "描述"           # 事件描述
#       warning_level: "高/中/低" # 预警级别
#
# 维护方式：人工根据大V帖子/公告/政策日历添加
#
# P2-4: 补充通用事件模板（实际事件按需添加）

events:
